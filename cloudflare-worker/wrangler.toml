name = "qwixit-api"
main = "worker.js"
compatibility_date = "2026-10-03"
preview_urls = false

[observability.logs]
enabled = true

[[durable_objects.bindings]]
name = "USAGE_LEDGER"
class_name = "UsageLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageLedger"]

# Per-minute request guards (docs/OPERATIONS.md). Keys are the installation ID
# and the client IP; neither is stored by the limiter beyond its window.
[[ratelimits]]
name = "INSTALLATION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
